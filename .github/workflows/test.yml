name: Test
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-test
  cancel-in-progress: true

jobs:
  checks:
    name: BEAM checks (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            system: aarch64-darwin
          - os: ubuntu-latest
            arch: x86_64
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert runner architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Assert Nix platform
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = '${{ matrix.system }}'
      - name: Evaluate native regressions and run the approved runtime
        run: |
          nix build -L --no-link \
            .#checks.${{ matrix.system }}.regression \
            .#checks.${{ matrix.system }}.devshell-interface \
            .#checks.${{ matrix.system }}.approved-runtime
