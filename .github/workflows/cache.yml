name: Cache
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-cache
  cancel-in-progress: true

jobs:
  packages:
    name: Publish approved BEAM pair (${{ matrix.system }})
    # Publishing is opt-in to the fork owner's existing cache. No foreign cache
    # is trusted, and PRs cannot publish with repository credentials.
    if: github.ref == 'refs/heads/develop' && vars.CACHIX_CACHE_NAME != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            system: aarch64-darwin
          - os: ubuntu-latest
            arch: x86_64
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check publishing credentials
        id: credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.configured == 'true'
      - name: Assert runner architecture
        if: steps.credentials.outputs.configured == 'true'
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        if: steps.credentials.outputs.configured == 'true'
      - name: Assert Nix platform
        if: steps.credentials.outputs.configured == 'true'
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = '${{ matrix.system }}'
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: steps.credentials.outputs.configured == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ./result
          skipAddingSubstituter: true
      - name: Build approved pair
        if: steps.credentials.outputs.configured == 'true'
        run: nix build -L .#packages.${{ matrix.system }}.example
